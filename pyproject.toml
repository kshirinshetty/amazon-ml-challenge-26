[project]
name = "amazon-ml"
version = "0.1.0"
description = "Business entity resolution for the Amazon ML Challenge 2026: multi-pass blocking, LightGBM and a cross-encoder"
readme = "README.md"
license = "MIT"
authors = [{ name = "Siddartha A Yogesha" }, { name = "Kshirin Shetty" }]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sparse-dot-topn>=1.2.0",
    "unidecode>=1.4.0",
]
